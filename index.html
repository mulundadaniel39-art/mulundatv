<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  >

  <title>Mulunda TV</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #appFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      border: none;
      display: block;
      background: #000;
    }

    @media screen and (max-width: 768px) and (orientation: portrait) {
      #appFrame {
        width: 100vw;
        height: 100dvh;
      }
    }

    @media screen and (orientation: landscape) {
      #appFrame {
        width: 100vw;
        height: 100dvh;
      }
    }
  </style>
</head>

<body>
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbycEQELkOkibByaD0RzEy0KhBrgneJrb3CXRkmXgX7T9l8nksnxtcfxct6dE4TU0aXkvA/exec"
    title="Mulunda TV"
    allow="camera https://script.google.com https://script.googleusercontent.com https://*.googleusercontent.com; autoplay; fullscreen; picture-in-picture"
    allowfullscreen
  ></iframe>
</body>
</html>
