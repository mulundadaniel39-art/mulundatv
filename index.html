<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Makes the page adapt correctly to phones and tablets -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  >

  <title>Mulunda TV</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #appFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      border: none;
      display: block;
      background: #000;
    }

    /* Phone in portrait mode */
    @media screen and (max-width: 768px) and (orientation: portrait) {
      #appFrame {
        width: 100vw;
        height: 100dvh;
      }
    }

    /* Phone or tablet in landscape mode */
    @media screen and (orientation: landscape) {
      #appFrame {
        width: 100vw;
        height: 100dvh;
      }
    }
  </style>
</head>

<body>
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbxRhWKf8Nids94_x6lkvyd2l9NTq_ki5NconGoj9tT4t5vOe9NCy7f6d4yTTMVs5ILlPw/exec"
    title="Mulunda TV"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen
  ></iframe>
</body>
</html>
